name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build APK via Capacitor
        run: |
          mkdir www
          # 將 index.php 另存為靜態網頁打包進 APK
          if [ -f "index.php" ]; then
            cp index.php www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "HEIF Converter" "com.heif.converter" --web-dir www
          npx cap add android
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heif-converter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
