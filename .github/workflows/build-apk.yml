name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build APK via Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "index.php" ]; then
            cp index.php www/index.html
          else
            echo "找不到 index.html 或 index.php 檔案"
            exit 1
          fi
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/assets sharp
          
          npx cap init "HEIF轉檔" "com.heif.converter" --web-dir www
          npx cap add android
          
          # 開啟大型記憶體 Heap 與硬體加速
          sed -i 's/<application/<application android:largeHeap="true" android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml
          
          # 套用 App Icon
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            npx @capacitor/assets generate --android
          fi
          
          npx cap sync
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heif-converter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
